<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Clientes — Sanor</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="section">
  <div class="container">

    <div id="login-view" class="login-card">
      <h1>Acceso Clientes</h1>
      <form id="login-form">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Mantené presionado para ver la contraseña">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Ingresar</button>
      </form>
      <p style="text-align:center;font-size:0.85rem;color:var(--color-text-soft);margin-top:18px;">
        ¿No tenés usuario? <a href="index.html#contacto" style="color:var(--color-primary);font-weight:600;">Contactanos</a>.
      </p>
    </div>

    <div id="client-view" class="client-panel" style="display:none;">
      <h1>¡Hola, <span id="client-name"></span>!</h1>
      <p id="pricelist-status">Buscando la última lista de precios…</p>
      <a id="pricelist-link" class="btn btn-primary" style="display:none;" target="_blank" rel="noopener">Descargar lista de precios</a>
      <a href="#" id="logout-link" class="logout-link">Cerrar sesión</a>
    </div>

  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/clientes.js"></script>
</body>
</html>
